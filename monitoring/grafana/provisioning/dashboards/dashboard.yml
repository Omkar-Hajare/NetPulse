# Auto-load dashboard JSON files from /var/lib/grafana/dashboards
apiVersion: 1

providers:
  - name: "NetPulse"
    orgId: 1
    folder: "NetPulse Pipeline"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
